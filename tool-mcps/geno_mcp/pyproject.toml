# Declarative metadata stub for geno_mcp. All 10 tool-mcps share a single
# Python environment installed at the repo root (pip install -e .), so the
# dependency spec here is informational — `mrbigr install geno_mcp` drives
# registration with an MCP client, not package installation.
[project]
name = "geno-mcp"
version = "0.1.0"
description = "MRBIGR2 genotype-processing MCP — QC, PCA, IBD, kinship, format conversion"
requires-python = ">=3.10"
dependencies = [
    "mrbigr2",      # shared analytical core
    "fastmcp>=2.0",
]

[project.scripts]
geno-mcp = "server:main"
